version: 2

models:
  - name: dim_business
    columns:
      - name: business_id
        data_tests: [unique, not_null]
  - name: dim_account
    columns:
      - name: account_id
        data_tests: [unique, not_null]
  - name: dim_period
    columns:
      - name: period_id
        data_tests: [unique, not_null]
  - name: dim_party
    columns:
      - name: party_id
        data_tests: [unique, not_null]
  - name: fact_gl_line
    columns:
      - name: journal_line_id
        data_tests: [unique, not_null]
      - name: business_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_business'), field: business_id}
      - name: account_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_account'), field: account_id}
  - name: fact_open_item_snapshot
    columns:
      - name: business_id
        data_tests:
          - relationships: {to: ref('dim_business'), field: business_id}
  - name: fact_order
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ['placed', 'accepted', 'resulted', 'resulted (placed before the hub)', 'cancelled', 'unknown']
  - name: mart_lab_volume_monthly
    columns:
      - name: month
        data_tests: [not_null]
      - name: test_key
        data_tests: [not_null]
      - name: results
        data_tests: [not_null]

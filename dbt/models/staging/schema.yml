version: 2

models:
  - name: stg_entity
    columns:
      - name: entity_id
        data_tests: [unique, not_null]
  - name: stg_account
    columns:
      - name: account_id
        data_tests: [unique, not_null]
  - name: stg_journal_entry
    columns:
      - name: journal_entry_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ['Draft', 'Posted', 'Reversed']
  - name: stg_journal_line
    columns:
      - name: journal_line_id
        data_tests: [unique, not_null]

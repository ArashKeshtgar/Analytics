[project]
name = "analytics"
version = "0.1.0"
description = "Reporting and forecasting for the ClinicHub platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
    "polars>=1.12",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "pyodbc>=5.3.0",
    "pyjwt[crypto]>=2.15.1",
    "pika>=1.4.4",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[rabbitmq]>=4.15.0",
]

[project.scripts]
analytics = "analytics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/synthetic_source.py" = ["E501"]  # SQL fixtures
"tests/e2e_stack.py" = ["E501"]  # SQL fixtures
"tests/fake_idp.py" = ["E501"]
"tests/synthetic_events.py" = ["E501"]  # a table in the docstring

[[tool.mypy.overrides]]
module = ["pyodbc", "pika", "pika.*", "testcontainers.*", "statsmodels.*", "sklearn.*"]
ignore_missing_imports = true
